<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bid Radar &middot; Edwards Bros</title>
<style>
:root{--bg:#0e1216;--panel:#161c22;--line:#2a343d;--ink:#eef2f4;--dim:#94a2ad;--link:#83c0ff;--match:#5fd08a;--build:#f4c560;--hard:#f08a7a;--eb:#6fd0c0;--sub:#9db4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:26px;margin:0 0 4px}.sub{color:var(--dim);font-size:13px;margin-bottom:16px}.sub a{color:var(--link)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;font:inherit;font-size:13px}
.tabs button:hover{color:var(--ink)}.tabs button.on{background:var(--ink);color:#0e1216;border-color:var(--ink);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card.local{border-color:rgba(111,208,192,.5)}.card.dropped{opacity:.72}.card.sub{border-color:rgba(157,180,255,.4)}
.card h3{font-size:16px;margin:0 0 6px;line-height:1.3}.card h3 a{color:var(--ink);text-decoration:none}.card h3 a:hover{color:var(--link)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 7px;margin:0 6px 5px 0;vertical-align:middle}
.tag.local{background:rgba(111,208,192,.16);color:var(--eb)}.tag.cat{background:#1c242c;color:var(--dim);font-weight:600}
.tag.new{background:rgba(131,192,255,.18);color:var(--link)}.tag.drop{background:rgba(240,138,122,.15);color:var(--hard)}
.tag.subt{background:rgba(157,180,255,.16);color:var(--sub)}.tag.amber{background:rgba(244,197,96,.16);color:var(--build)}
.line{font-size:13px;color:var(--dim);margin-bottom:4px}.line b{color:var(--ink)}
.btn{background:transparent;border:1px solid var(--line);color:var(--link);border-radius:8px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;margin-top:8px}
.btn:hover{border-color:var(--link)}.btn:disabled{opacity:.6;cursor:default}
.box{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px}
.v{font-weight:700;font-size:14px}.v.bid{color:var(--match)}.v.prime{color:var(--match)}.v.sub{color:var(--sub)}.v.watch{color:var(--build)}.v.nobid{color:var(--hard)}
.row{margin-top:5px}.row b{color:var(--ink)}.hint{color:var(--dim)}
.state{color:var(--dim);padding:20px 0}
.login{max-width:360px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.login h1{font-size:22px;margin:0 0 4px}.login p{color:var(--dim);font-size:13px;margin:0 0 18px}
.login label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
.login input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;font-size:14px;padding:10px 12px}
.login input:focus{outline:none;border-color:var(--link)}
.login .go{width:100%;margin-top:18px;background:var(--link);color:#04243f;border:0;border-radius:8px;font:inherit;font-weight:600;font-size:14px;padding:11px;cursor:pointer}
.login .go:disabled{opacity:.6}.login .msg{font-size:13px;margin-top:12px;min-height:18px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px;color:var(--dim)}
.topbar .out{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.hidden{display:none}
.ta{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:13px;padding:12px}
.ta:focus{outline:none;border-color:var(--link)}
.fl{padding:6px 10px;margin:4px 0;border-left:3px solid var(--line);background:#121820;border-radius:6px;font-size:13px}.fl b{color:var(--ink)}
.fl-red{border-color:var(--hard)}.fl-amber{border-color:var(--build)}.fl-green{border-color:var(--match)}.fl-na{border-color:var(--line);opacity:.6}
</style></head><body>

<div id="loginView" class="login hidden">
  <h1>Bid Radar</h1><p>Private &mdash; sign in to continue.</p>
  <label>Email</label><input id="liEmail" type="email" autocomplete="username" placeholder="you@company.com">
  <label>Password</label><input id="liPass" type="password" autocomplete="current-password" placeholder="Password">
  <button id="liGo" class="go">Sign in</button><div class="msg" id="liMsg"></div>
</div>

<div id="appView" class="wrap hidden">
  <div class="topbar"><span id="who"></span><button class="out" id="signout">Sign out</button></div>
  <h1>Bid Radar</h1>
  <div class="sub">Open English public-sector tenders screened against the Edwards Bros profile. Tap &ldquo;Should we bid?&rdquo; for a verdict.</div>
  <div class="tabs" id="tabs">
    <button data-m="primeable" class="on">Primeable</button>
    <button data-m="local">Local</button>
    <button data-m="needssub">Needs a sub</button>
    <button data-m="all">All open</button>
    <button data-m="pipeline">Pipeline</button>
    <button data-m="expiring">Re-tenders</button>
    <button data-m="check">Check a tender</button>
  </div>
  <div id="list"><div class="state">Loading tenders&hellip;</div></div>
</div>

<script>
var SUPABASE_URL="https://xeadalusejspxhqesisv.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlYWRhbHVzZWpzcHhocWVzaXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NDA3MDQsImV4cCI6MjA5NjQxNjcwNH0.i_-TytaPBtOTCoI0-1OlSBSX5kbiUrOQGCWgUTodrfU";

// ---- Editable settings ----
var CFG={
  capGBP:90000,
  categories:["consulting","professional_services","accounting","data_services","software"],
  minWorkingDays:10,
  frameworksWeAreOn:["bloom"],
  subCategories:[ {re:/tree works|arboricultur|grounds maintenance|landscap|grass cutting|hedge|verge|green space/i, name:"grounds maintenance", sub:"none yet"} ]
};

var ACCESS=null, ALLROWS=[], MODE="primeable", LASTVISIT=null, RETENDERS=null, RET_ALL=false;
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function show(id){document.getElementById(id).classList.remove("hidden");}
function hide(id){document.getElementById(id).classList.add("hidden");}
function authHeaders(){return {apikey:ANON,Authorization:"Bearer "+ACCESS};}
function saveSession(a,r,e){ACCESS=a;try{localStorage.setItem("sb_access",a);localStorage.setItem("sb_refresh",r);if(e)localStorage.setItem("sb_email",e);}catch(x){}}
function clearSession(){ACCESS=null;try{localStorage.removeItem("sb_access");localStorage.removeItem("sb_refresh");localStorage.removeItem("sb_email");}catch(x){}}

function signin(){
  var email=document.getElementById("liEmail").value.trim(),pass=document.getElementById("liPass").value;
  var msg=document.getElementById("liMsg"),go=document.getElementById("liGo");
  if(!email||!pass){msg.style.color="#f4c560";msg.textContent="Enter your email and password.";return;}
  go.disabled=true;msg.style.color="#94a2ad";msg.textContent="Signing in...";
  fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON},body:JSON.stringify({email:email,password:pass})})
   .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
   .then(function(res){ if(!res.ok||!res.d.access_token){msg.style.color="#f08a7a";msg.textContent=(res.d.error_description||res.d.msg||res.d.error||"Sign-in failed.");go.disabled=false;return;}
     saveSession(res.d.access_token,res.d.refresh_token,email);startApp(email); })
   .catch(function(){msg.style.color="#f08a7a";msg.textContent="Could not reach the server.";go.disabled=false;});
}
function refresh(){ var rt=null;try{rt=localStorage.getItem("sb_refresh");}catch(x){} if(!rt)return Promise.resolve(false);
  return fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON},body:JSON.stringify({refresh_token:rt})})
   .then(function(r){return r.ok?r.json():null;})
   .then(function(d){if(d&&d.access_token){var em=null;try{em=localStorage.getItem("sb_email");}catch(x){}saveSession(d.access_token,d.refresh_token,em);return true;}return false;})
   .catch(function(){return false;});
}
function signout(){clearSession();hide("appView");show("loginView");document.getElementById("liPass").value="";}
function startApp(email){hide("loginView");show("appView");document.getElementById("who").textContent=email?("Signed in as "+email):"Signed in";load();}

function fmtDate(d){ if(!d) return ""; return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function val(t){ return (t.value_max!=null)?t.value_max:(t.value_min!=null?t.value_min:null); }
function money(t){ var v=val(t); return (t.value_known===false)?"value unknown":(v!=null?("£"+Number(v).toLocaleString("en-GB")):"value not stated"); }
function workingDays(d){ if(!d) return null; var end=new Date(d), now=new Date(); if(end<=now) return 0; var cur=new Date(); cur.setHours(0,0,0,0); var c=0; while(cur<end){ var g=cur.getDay(); if(g!==0&&g!==6)c++; cur.setDate(cur.getDate()+1);} return c; }
function frameworkCallOff(t){ var s=((t.title||"")).toLowerCase().trim(); if(/call-?off|mini[- ]competition|further competition/.test(s))return "a framework"; return null; }
function matchSub(t){ var s=(t.title||"")+" "+(t.cls_category||"")+" "+(t.description||""); for(var i=0;i<CFG.subCategories.length;i++){ if(CFG.subCategories[i].re.test(s)) return CFG.subCategories[i]; } return null; }

// classify → {bucket:'primeable'|'needssub'|'dropped', tags:[], reasons:[], sub}
function classify(t){
  var tags=[], reasons=[], amber=[];
  if(t.value_known===false){ reasons.push("value unknown"); tags.push("VALUE UNKNOWN"); }
  else { var v=val(t); if(v!=null && v>CFG.capGBP){ reasons.push("over £"+Math.round(CFG.capGBP/1000)+"k"); tags.push("OVER CAP"); } }
  if(t.buyer_type==="private"){ reasons.push("not a public buyer"); tags.push("NOT A PUBLIC BUYER"); }
  else if(t.buyer_type==="unsure"){ amber.push("CHECK BUYER"); }
  if(t.nation==="Overseas"){ reasons.push("overseas delivery"); tags.push("OVERSEAS DELIVERY"); }
  else if(t.nation && t.nation!=="England"){ reasons.push("outside England ("+t.nation+")"); tags.push("OUTSIDE ENGLAND ("+t.nation+")"); }
  var wd=workingDays(t.deadline_date); if(wd!=null && wd<CFG.minWorkingDays){ reasons.push("closes in "+wd+" working day"+(wd===1?"":"s")); tags.push("CLOSES SOON"); }
  if(t.is_dps===true){ reasons.push("framework/DPS to join"); tags.push("FRAMEWORK / DPS"); }
  var fw=frameworkCallOff(t); if(fw && CFG.frameworksWeAreOn.indexOf(fw.toLowerCase())<0){ reasons.push("framework call-off"); tags.push("FRAMEWORK CALL-OFF"); }
  var gatesPass = reasons.length===0;
  var ours = t.cls_category && CFG.categories.indexOf(t.cls_category)>=0;
  var sub = matchSub(t);
  if(gatesPass && ours) return {bucket:"primeable", tags:tags, reasons:reasons, amber:amber, sub:null};
  if(gatesPass && sub) return {bucket:"needssub", tags:tags, reasons:reasons, amber:amber, sub:sub};
  if(!ours && !sub){ reasons.push("category not one we sell ("+(t.cls_category||"?")+")"); tags.push("CATEGORY NOT SOLD"); }
  return {bucket:"dropped", tags:tags, reasons:reasons, amber:amber, sub:sub};
}
function isLocal(t){ var c=classify(t); return (c.bucket==="primeable"||c.bucket==="needssub") && t.is_local===true; }
function isNew(t){ return LASTVISIT && t.published_date && (new Date(t.published_date).getTime()>LASTVISIT); }

function verdictClass(v){ v=(v||"").toUpperCase(); if(v.indexOf("NO-BID")===0||v.indexOf("NO BID")===0)return "nobid"; if(v.indexOf("APPROACH")===0)return "sub"; if(v.indexOf("WATCH")===0)return "watch"; if(v.indexOf("BID")===0)return v.indexOf("PRIME")>=0?"prime":"bid"; return "watch"; }

function card(t){
  var c=classify(t), local=t.is_local===true;
  var catLabel=(c.bucket==="needssub"&&c.sub)?c.sub.name:t.cls_category;
  var tags=(isNew(t)?'<span class="tag new">New</span>':'')+(local?'<span class="tag local">Local</span>':'')+(catLabel?('<span class="tag cat">'+esc(catLabel)+'</span>'):'');
  for(var a2=0;a2<(c.amber||[]).length;a2++){ tags+='<span class="tag amber">'+esc(c.amber[a2])+'</span>'; }
  for(var i=0;i<c.tags.length;i++){ tags+='<span class="tag drop">'+esc(c.tags[i])+'</span>'; }
  var subNote = (c.bucket==="needssub") ? ('<div class="line">Needs a subcontractor for <b>'+esc(c.sub.name)+'</b> — '+(c.sub.sub==="none yet"?'none lined up yet (verdict: Watch)':('sub: '+esc(c.sub.sub)+' (verdict: Bid as prime)'))+'</div>') : '';
  var cls = c.bucket==="dropped" ? " dropped" : (c.bucket==="needssub" ? " sub" : (local?" local":""));
  return '<div class="card'+cls+'"><h3>'+(t.source_url?('<a href="'+esc(t.source_url)+'" target="_blank" rel="noopener">'+esc(t.title)+'</a>'):esc(t.title))+'</h3>'
   +'<div class="line">'+tags+'</div>'
   +'<div class="line"><b>'+esc(t.buyer_name||"Unknown buyer")+'</b> &middot; '+money(t)+(t.deadline_date?(' &middot; closes '+fmtDate(t.deadline_date)):'')+'</div>'
   +subNote
   +'<button class="btn" data-id="'+esc(t.id)+'">Should we bid?</button>'
   +' <button class="btn" data-track="'+esc(t.id)+'">+ Track</button>'
   +'<div class="box" id="b-'+esc(t.id)+'" style="display:none"></div></div>';
}
function triage(btn,id){
  var box=document.getElementById("b-"+id);box.style.display="block";
  box.innerHTML='<span class="hint">Checking whether to bid&hellip;</span>';btn.disabled=true;
  fetch(SUPABASE_URL+"/functions/v1/bid-triage",{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ACCESS},body:JSON.stringify({tender_id:id})})
   .then(function(r){return r.json();})
   .then(function(d){
     if(!d||!d.ok||!d.triage){box.innerHTML='<span class="hint">Triage unavailable ('+esc((d&&(d.message||d.error))||"error")+').</span>';btn.disabled=false;return;}
     var t=d.triage,v=(t.verdict||"").toUpperCase();
     box.innerHTML='<div class="v '+verdictClass(v)+'">'+esc(v||"?")+'</div>'
      +(t.fit?('<div class="row"><b>Fit:</b> '+esc(t.fit)+'</div>'):'')
      +(t.reason?('<div class="row"><b>Why:</b> '+esc(t.reason)+'</div>'):'')
      +(t.self_deliver?('<div class="row"><b>We deliver:</b> '+esc(t.self_deliver)+'</div>'):'')
      +(t.subcontract?('<div class="row"><b>Subcontract:</b> '+esc(t.subcontract)+'</div>'):'')
      +(t.red_flags?('<div class="row"><b>Red flags:</b> '+esc(t.red_flags)+'</div>'):'');
     btn.textContent="Re-check";btn.disabled=false;
   })
   .catch(function(){box.innerHTML='<span class="hint">Could not reach triage.</span>';btn.disabled=false;});
}

function monthsUntil(d){ if(!d) return null; var ms=new Date(d).getTime()-Date.now(); return Math.max(0,Math.round(ms/2629800000)); }
function retCard(c){ var local=!!c.local; var v=(c.value!=null)?("£"+Number(c.value).toLocaleString("en-GB")):"value not stated"; var m=monthsUntil(c.ends);
  return '<div class="card'+(local?' local':'')+'"><h3>'+(c.url?('<a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.title)+'</a>'):esc(c.title))+'</h3>'
   +'<div class="line">'+(local?'<span class="tag local">Local</span>':'')+(c.category?('<span class="tag cat">'+esc(c.category)+'</span>'):'')+'</div>'
   +'<div class="line"><b>'+esc(c.buyer||"Unknown buyer")+'</b> &middot; '+v+' &middot; ends '+fmtDate(c.ends)+(m!=null?(" (in ~"+m+" month"+(m===1?"":"s")+")"):"")+'</div>'
   +(c.incumbent?('<div class="line">Incumbent: <b>'+esc(c.incumbent)+'</b></div>'):'')+'</div>'; }
function renderExpiring(){
  var btns=document.querySelectorAll("#tabs button"); for(var j=0;j<btns.length;j++){ btns[j].classList.toggle("on", btns[j].getAttribute("data-m")===MODE); }
  var list=document.getElementById("list");
  if(RETENDERS===null){ list.innerHTML='<div class="state">Loading re-tender calendar&hellip;</div>';
    fetch(SUPABASE_URL+"/functions/v1/retender",{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ACCESS},body:JSON.stringify({from:6,to:18,limit:150,all:RET_ALL})})
     .then(function(r){return r.json();})
     .then(function(d){ RETENDERS=(d&&d.contracts)?d.contracts:[]; if(MODE==="expiring") renderExpiring(); })
     .catch(function(){ list.innerHTML='<div class="state">Could not load the re-tender calendar.</div>'; });
    return; }
  if(!RETENDERS.length){ list.innerHTML='<div class="state">No expiring contracts in your categories for the next 6&ndash;18 months.</div>'; return; }
  var tgl='<button class="btn" id="retToggle" style="margin-bottom:8px">'+(RET_ALL?"Show default band (£10k–£150k)":"Show all values")+'</button>';
  list.innerHTML='<div class="sub">'+RETENDERS.length+' contract'+(RETENDERS.length===1?"":"s")+' ending in 6&ndash;18 months &middot; '+(RET_ALL?"all values":"£10k–£150k")+' &middot; incumbent shown &middot; local first.</div>'+tgl+RETENDERS.map(retCard).join("");
  var rt=document.getElementById("retToggle"); if(rt){ rt.addEventListener("click",function(){ RET_ALL=!RET_ALL; RETENDERS=null; renderExpiring(); }); }
}

function ragClass(r){ r=(r||"").toLowerCase(); return r==="red"?"fl-red":(r==="amber"?"fl-amber":(r==="green"?"fl-green":"fl-na")); }
function renderCheck(){
  var btns=document.querySelectorAll("#tabs button"); for(var j=0;j<btns.length;j++){ btns[j].classList.toggle("on", btns[j].getAttribute("data-m")===MODE); }
  var list=document.getElementById("list");
  list.innerHTML='<div class="sub">Paste a tender (notice or ITT/spec text) &mdash; Bloom invites, portal PDFs, anything not in the feed. It screens it, RAG-rates the flags and gives a verdict.</div>'
   +'<textarea class="ta" id="chkText" placeholder="Paste the tender text here..."></textarea>'
   +'<button class="btn" id="chkGo" style="margin-top:10px">Assess tender</button>'
   +'<div id="chkOut" style="margin-top:12px"></div>';
  document.getElementById("chkGo").addEventListener("click", assessTender);
}
function assessTender(){
  var txt=document.getElementById("chkText").value.trim(), out=document.getElementById("chkOut"), go=document.getElementById("chkGo");
  if(txt.length<20){ out.innerHTML='<span class="hint">Paste a bit more of the tender text.</span>'; return; }
  go.disabled=true; out.innerHTML='<span class="hint">Assessing against the Edwards Bros profile&hellip;</span>';
  fetch(SUPABASE_URL+"/functions/v1/assess",{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ACCESS},body:JSON.stringify({text:txt})})
   .then(function(r){return r.json();})
   .then(function(d){ go.disabled=false;
     if(!d||!d.ok||!d.assessment){ out.innerHTML='<span class="hint">Could not assess ('+esc((d&&d.error)||"error")+').</span>'; return; }
     var a=d.assessment, v=(a.verdict||"").toUpperCase(), ex=a.extracted||{};
     var h='<div class="box"><div class="v '+verdictClass(v)+'">'+esc(v||"?")+'</div>';
     if(a.notice_only) h+='<div class="row hint">Based on the notice only; full documents not read.</div>';
     if(ex.title) h+='<div class="row"><b>'+esc(ex.title)+'</b>'+(ex.buyer?(" — "+esc(ex.buyer)):"")+(ex.value?(" &middot; "+esc(ex.value)):"")+'</div>';
     if(a.reason) h+='<div class="row"><b>Why:</b> '+esc(a.reason)+'</div>';
     if(a.self_deliver) h+='<div class="row"><b>We deliver:</b> '+esc(a.self_deliver)+'</div>';
     if(a.subcontract) h+='<div class="row"><b>Subcontract:</b> '+esc(a.subcontract)+'</div>';
     h+='</div>';
     var flags=a.flags||[], lastG="";
     for(var i=0;i<flags.length;i++){ var f=flags[i]; if((f.group||"")!==lastG){ h+='<div class="line" style="margin-top:10px"><b>'+esc(f.group||"")+'</b></div>'; lastG=f.group||""; } h+='<div class="fl '+ragClass(f.rag)+'"><b>'+esc(f.flag||"")+'</b> &mdash; '+esc(f.note||"")+'</div>'; }
     out.innerHTML=h;
   })
   .catch(function(){ go.disabled=false; out.innerHTML='<span class="hint">Could not reach the assessor.</span>'; });
}

function stageSelect(id,cur){ var ss=["watching","preparing","submitted","won","lost","no-bid","dropped"]; var h='<select data-pid="'+esc(id)+'" class="pstage" style="background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font:inherit;font-size:12px">'; for(var i=0;i<ss.length;i++){ h+='<option'+(ss[i]===cur?" selected":"")+'>'+ss[i]+'</option>'; } return h+'</select>'; }
function pipelineAdd(btn,id){
  var t=null; for(var i=0;i<ALLROWS.length;i++){ if(String(ALLROWS[i].id)===String(id)){ t=ALLROWS[i]; break; } }
  if(!t){ return; }
  btn.disabled=true; btn.textContent="Tracking…";
  var body={ tender_id:String(t.id), title:t.title, buyer:t.buyer_name, value_text:money(t), source_url:t.source_url, deadline:(t.deadline_date?String(t.deadline_date).slice(0,10):null), stage:"watching" };
  fetch(SUPABASE_URL+"/rest/v1/pipeline",{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ACCESS,Prefer:"return=minimal"},body:JSON.stringify(body)})
   .then(function(r){ btn.textContent=r.ok?"Tracked ✓":"Track failed"; })
   .catch(function(){ btn.disabled=false; btn.textContent="Track failed"; });
}
function pipelineSetStage(id,stage){
  fetch(SUPABASE_URL+"/rest/v1/pipeline?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ACCESS,Prefer:"return=minimal"},body:JSON.stringify({stage:stage,updated_at:new Date().toISOString()})});
}
function renderPipeline(){
  var btns=document.querySelectorAll("#tabs button"); for(var j=0;j<btns.length;j++){ btns[j].classList.toggle("on", btns[j].getAttribute("data-m")===MODE); }
  var list=document.getElementById("list"); list.innerHTML='<div class="state">Loading pipeline&hellip;</div>';
  fetch(SUPABASE_URL+"/rest/v1/pipeline?select=id,title,buyer,value_text,source_url,deadline,stage,notes,updated_at&order=updated_at.desc",{headers:authHeaders()})
   .then(function(r){return r.json();})
   .then(function(rows){
     if(!rows||!rows.length){ list.innerHTML='<div class="sub">Pipeline</div><div class="state">Nothing tracked yet. On any tender, tap <b>+ Track</b> to add it here, then set its stage as it progresses.</div>'; return; }
     var order=["watching","preparing","submitted","won","lost","no-bid","dropped"];
     rows.sort(function(a,b){ return order.indexOf(a.stage)-order.indexOf(b.stage); });
     var won=rows.filter(function(p){return p.stage==="won";}).length, sub=rows.filter(function(p){return p.stage==="submitted";}).length;
     var html='<div class="sub">'+rows.length+' tracked &middot; '+sub+' submitted &middot; '+won+' won</div>';
     html+=rows.map(function(p){ return '<div class="card"><h3>'+(p.source_url?('<a href="'+esc(p.source_url)+'" target="_blank" rel="noopener">'+esc(p.title||"(untitled)")+'</a>'):esc(p.title||"(untitled)"))+'</h3>'
       +'<div class="line"><b>'+esc(p.buyer||"")+'</b>'+(p.value_text?(' &middot; '+esc(p.value_text)):'')+(p.deadline?(' &middot; closes '+fmtDate(p.deadline)):'')+'</div>'
       +'<div class="line">Stage: '+stageSelect(p.id,p.stage)+'</div></div>'; }).join("");
     list.innerHTML=html;
     var sel=document.querySelectorAll(".pstage");
     for(var i=0;i<sel.length;i++){(function(x){x.addEventListener("change",function(){pipelineSetStage(x.getAttribute("data-pid"),x.value);});})(sel[i]);}
   })
   .catch(function(){ list.innerHTML='<div class="state">Could not load the pipeline.</div>'; });
}
function bucketRows(bucket){
  var rows=(ALLROWS||[]).filter(function(t){ return classify(t).bucket===bucket; });
  rows.sort(function(a,b){ var la=(a.is_local===true)?0:1, lb=(b.is_local===true)?0:1; if(la!==lb) return la-lb;
    var da=a.deadline_date?new Date(a.deadline_date).getTime():8e15, db=b.deadline_date?new Date(b.deadline_date).getTime():8e15; return da-db; });
  return rows;
}
function renderList(){
  if(MODE==="expiring"){ return renderExpiring(); }
  if(MODE==="check"){ return renderCheck(); }
  if(MODE==="pipeline"){ return renderPipeline(); }
  var btns=document.querySelectorAll("#tabs button");
  for(var j=0;j<btns.length;j++){ btns[j].classList.toggle("on", btns[j].getAttribute("data-m")===MODE); }
  var list=document.getElementById("list"), rows, label;
  if(MODE==="primeable"){ rows=bucketRows("primeable"); label="primeable"; }
  else if(MODE==="local"){ rows=bucketRows("primeable").concat(bucketRows("needssub")).filter(function(t){return t.is_local===true;}); label="local"; }
  else if(MODE==="needssub"){ rows=bucketRows("needssub"); label="needs-a-sub"; }
  else { rows=bucketRows("primeable").concat(bucketRows("needssub")).concat(bucketRows("dropped")); label="open"; }
  if(!rows.length){ list.innerHTML='<div class="state">No '+label+' tenders right now. New ones arrive each morning &mdash; check back, or try another tab.</div>'; return; }
  var nc=rows.filter(isNew).length, nb=nc?(" &middot; "+nc+" new"):"";
  var note = MODE==="all" ? ' <span class="hint">(primeable first, then needs-a-sub, then dropped with the reason)</span>' : '';
  list.innerHTML='<div class="sub">'+rows.length+' '+label+' tender'+(rows.length===1?"":"s")+nb+note+'</div>'+rows.map(card).join("");
  var tb=document.querySelectorAll(".btn[data-id]");
  for(var i=0;i<tb.length;i++){(function(b){b.addEventListener("click",function(){triage(b,b.getAttribute("data-id"));});})(tb[i]);}
  var tk=document.querySelectorAll(".btn[data-track]");
  for(var m2=0;m2<tk.length;m2++){(function(b){b.addEventListener("click",function(){pipelineAdd(b,b.getAttribute("data-track"));});})(tk[m2]);}
}
function setMode(m){ MODE=m; renderList(); }

function dedupe(rows){
  var seen={}, out=[];
  for(var i=0;i<rows.length;i++){ var t=rows[i]; var k=((t.buyer_name||"")+"|"+(t.title||"")+"|"+(t.deadline_date||"")).toLowerCase(); if(seen[k]) continue; seen[k]=1; out.push(t); }
  return out;
}
function load(retried){
  if(LASTVISIT===null){try{LASTVISIT=parseInt(localStorage.getItem("sb_lastvisit")||"0",10)||0;}catch(x){LASTVISIT=0;}}
  var nowISO=new Date().toISOString();
  var q=SUPABASE_URL+"/rest/v1/v_cf?select=id,notice_id,title,buyer_name,cls_category,value_min,value_max,deadline_date,published_date,source_url,nation,is_local,buyer_type,value_known,is_dps,description&stage=eq.tender&or=(deadline_date.gte."+encodeURIComponent(nowISO)+",deadline_date.is.null)&order=deadline_date.asc&limit=1200";
  fetch(q,{headers:authHeaders()})
   .then(function(r){ if(r.status===401 && !retried){return refresh().then(function(ok){if(ok){load(true);}else{signout();}return null;});} return r.json(); })
   .then(function(rows){ if(rows){ ALLROWS=dedupe(rows.filter(function(t){ return !(t.deadline_date && new Date(t.deadline_date)<new Date()); })); renderList(); try{localStorage.setItem("sb_lastvisit",String(Date.now()));}catch(x){} } })
   .catch(function(e){ document.getElementById("list").innerHTML='<div class="state">Could not load tenders ('+esc(e&&e.message?e.message:"error")+').</div>'; });
}

document.getElementById("liGo").addEventListener("click",signin);
document.getElementById("liPass").addEventListener("keydown",function(e){if(e.key==="Enter")signin();});
document.getElementById("signout").addEventListener("click",signout);
var tabBtns=document.querySelectorAll("#tabs button");
for(var k=0;k<tabBtns.length;k++){(function(b){b.addEventListener("click",function(){setMode(b.getAttribute("data-m"));});})(tabBtns[k]);}
(function init(){ var em=null;try{em=localStorage.getItem("sb_email");}catch(x){} refresh().then(function(ok){ if(ok){startApp(em);} else { clearSession(); show("loginView"); } }); })();
</script>
</body></html>
