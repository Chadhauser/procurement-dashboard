<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procurement Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1216; --panel:#161c22; --panel2:#1c242c; --line:#2a343d;
    --ink:#eef2f4; --dim:#94a2ad; --faint:#6f7d88;
    --match:#5fd08a; --build:#f4c560; --hard:#f08a7a; --link:#83c0ff; --lead:#c9a3f0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#19222b 0%,var(--bg) 60%);
    color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:40px 20px 80px}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--build);margin-bottom:6px}
  h1{font-family:"Fraunces",serif;font-weight:800;font-size:38px;line-height:1.05;margin:0 0 16px;letter-spacing:-.01em}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;gap:4px}
  .seg button{background:transparent;color:var(--dim);border:0;border-radius:999px;padding:9px 18px;cursor:pointer;
    font:inherit;font-size:14px;font-weight:600;transition:.15s}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--ink);color:#0e1216}
  .lede{color:var(--dim);font-size:14px;max-width:640px;margin-bottom:6px}
  .runline{color:var(--faint);font-size:12px;margin-bottom:22px}
  .stats{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;min-width:120px;flex:1}
  .stat b{font-family:"Fraunces",serif;font-size:34px;font-weight:600;display:block;line-height:1}
  .stat span{color:var(--dim);font-size:12px;display:block;margin-top:6px}
  .stat[data-f]{cursor:pointer;transition:border-color .15s,transform .05s}
  .stat[data-f]:hover{border-color:var(--ink)}
  .stat[data-f]:hover span{color:var(--ink)}
  .stat[data-f]:active{transform:translateY(1px)}
  .stat[data-f].on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .readiness{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 18px 14px;margin-bottom:24px}
  .readiness summary{cursor:pointer;font-family:"Fraunces",serif;font-size:17px;font-weight:600;padding:12px 0;list-style:none;outline:none}
  .readiness summary::-webkit-details-marker{display:none}
  .readiness summary::after{content:"\25BE";float:right;color:var(--faint);font-size:13px}
  .rsum{color:var(--dim);font-size:12px;margin:0 0 8px}
  .rrow{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
  .rdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;position:relative;top:1px}
  .rdot.done{background:var(--match)} .rdot.prog{background:var(--build)} .rdot.todo{background:var(--faint)}
  .rname{flex:0 0 230px;color:var(--ink)}
  .rprio{font-size:10px;color:var(--build);text-transform:uppercase;letter-spacing:.06em;margin-left:6px}
  .rnext{color:var(--dim);font-size:12px;flex:1 1 200px}
  @media(max-width:560px){.rname{flex-basis:100%}}
  .controls{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tabs button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;cursor:pointer;font:inherit;font-size:13px;transition:.15s}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{background:var(--ink);color:#0e1216;border-color:var(--ink);font-weight:600}
  .toggle{display:inline-flex;align-items:center;gap:7px;color:var(--dim);font-size:12.5px;cursor:pointer;margin-left:auto;user-select:none}
  .toggle input{accent-color:var(--match);width:15px;height:15px;cursor:pointer;margin:0}
  @media(max-width:560px){.toggle{margin-left:0;width:100%}}
  .legend{font-size:11.5px;color:var(--faint);margin:0 0 20px;line-height:1.7}
  .legend b{color:var(--dim);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
  .card.match{border-color:rgba(95,208,138,.5);box-shadow:0 0 0 1px rgba(95,208,138,.12)}
  .card.closed{opacity:.6}
  .card.closed.match{box-shadow:none;border-color:var(--line)}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--faint);margin-bottom:9px}
  .meta .geo{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--dim)}
  .pill{font-weight:600;padding:2px 9px;border-radius:6px;letter-spacing:.02em}
  .pill.m{background:var(--match);color:#06281a}
  .pill.b{background:var(--build);color:#3a2c06}
  .pill.o{background:var(--link);color:#04243f}
  .pill.l{background:rgba(201,163,240,.16);color:var(--lead);border:1px solid rgba(201,163,240,.4)}
  .pill.c{background:var(--panel2);color:var(--faint);border:1px solid var(--line)}
  .pill.d-hard{background:rgba(240,138,122,.16);color:var(--hard);border:1px solid rgba(240,138,122,.4)}
  .pill.d-moderate{background:rgba(244,197,96,.14);color:var(--build);border:1px solid rgba(244,197,96,.35)}
  .pill.d-easy{background:rgba(95,208,138,.14);color:var(--match);border:1px solid rgba(95,208,138,.35)}
  h3{font-family:"Fraunces",serif;font-weight:600;font-size:20px;margin:2px 0 9px;line-height:1.25}
  h3 a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
  h3 a:hover{border-color:var(--link);color:var(--link)}
  .line{font-size:13.5px;margin-bottom:5px}
  .line.sub{color:var(--dim)}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:1px 9px;margin-left:5px;font-size:11px;color:var(--dim)}
  .why{font-size:12.5px;color:var(--dim);font-style:italic;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .build{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .bh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .bh b{color:var(--ink)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .dot.partial{background:var(--build)} .dot.yes{background:var(--match)}
  .bl{font-size:13px;margin:6px 0;color:#c8d2da}
  .bl em{display:inline-block;min-width:70px;color:var(--faint);font-style:normal;font-size:11px;
    letter-spacing:.04em;text-transform:uppercase;vertical-align:top}
  .bl.warn{color:#f6cfa4}
  .bidbtn{display:inline-block;margin-top:14px;font-size:13px;font-weight:600;color:#06281a;
    background:var(--match);padding:8px 14px;border-radius:9px;border:0;cursor:pointer;font-family:inherit}
  .pack{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .pack.open{display:block}
  .pack h4{font-family:"Fraunces",serif;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--build);margin:16px 0 6px}
  .pack h5{font-size:13px;color:#cdd6dd;margin:12px 0 3px}
  .pack p{font-size:13px;color:#c8d2da;margin:6px 0}
  .pack ul{margin:6px 0;padding-left:20px} .pack li{font-size:13px;color:#c8d2da;margin:3px 0}
  .pack .disc{color:var(--faint);font-size:11.5px;margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
  footer{color:var(--faint);font-size:11px;margin-top:30px;text-align:center;line-height:1.7}
  .state{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--dim);font-size:14px}
  .state.err{border-color:rgba(240,138,122,.4);color:#f6cfa4}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Procurement intelligence</div>
  <h1>Procurement Intel</h1>

  <div class="seg" id="seg">
    <button data-j="uk" class="on">🇬🇧 UK contracts</button>
    <button data-j="us">🇺🇸 US in the UK</button>
  </div>

  <div class="lede" id="lede">Loading&hellip;</div>
  <div class="runline" id="updated"></div>

  <div class="stats" id="stats"></div>

  <details class="readiness" id="readiness" open>
    <summary>Supplier readiness &mdash; getting eligible to win</summary>
    <div id="rlist"><div class="rsum">Loading&hellip;</div></div>
  </details>

  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <label class="toggle"><input type="checkbox" id="hideClosed" checked> Hide closed &amp; awarded</label>
  </div>
  <div class="legend" id="legend"></div>

  <div id="list"><div class="state">Loading&hellip;</div></div>

  <footer>
    Source: <span id="src">Find a Tender &amp; Contracts Finder</span><br>
    Draft material is a starting point, not legal or financial advice &mdash; confirm everything against the actual notice.
  </footer>
</div>

<script>
const SUPABASE_URL = "https://xeadalusejspxhqesisv.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlYWRhbHVzZWpzcHhocWVzaXN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NDA3MDQsImV4cCI6MjA5NjQxNjcwNH0.i_-TytaPBtOTCoI0-1OlSBSX5kbiUrOQGCWgUTodrfU";
const HEADERS = { apikey: ANON, Authorization: "Bearer " + ANON };

const SOLO = { yes:"Buildable solo + AI", partial:"Software yes - full service no" };
const DIFF = { hard:"Hard to win", moderate:"Moderate", easy:"Easy" };
const RST = { done:{l:"on",c:"done"}, in_progress:{l:"in progress",c:"prog"}, not_started:{l:"to do",c:"todo"} };

// Per-jurisdiction view config: what the stats, tabs, labels and legend say.
const VIEW = {
  uk: {
    lede: "UK public-sector tenders, split two ways: work IPP can bid on itself, and live contracts where a business needs help winning (your bid-support leads).",
    source: "Find a Tender &amp; Contracts Finder &middot; &copy; Crown copyright, OGL v3.0",
    legend: "<b>FOR IPP</b> finance / data / advisory work you can bid &middot; <b>LEAD</b> a live SME-suitable contract &mdash; a firm to approach with bid help &middot; <b>OPEN</b> accepting bids &middot; <b>BUILD</b> buildable solo &middot; <b>AWARDED</b> already won",
    stats: [
      { f:"all",  id:"total", label:"tenders seen" },
      { f:"open", id:"open",  label:"open to bid now", color:"var(--link)" },
      { f:"ipp",  id:"ipp",   label:"for IPP to bid",  color:"var(--match)" },
      { f:"lead", id:"lead",  label:"bid-support leads", color:"var(--lead)" },
    ],
    tabs: [
      { f:"ipp",  label:"For IPP to bid" },
      { f:"lead", label:"Bid-support leads" },
      { f:"build", label:"Buildable" },
      { f:"all",  label:"All" },
    ],
    default: "ipp",
  },
  us: {
    lede: "Every US-government contract performed in the UK, indexed daily by place of performance. The USAF bases are the core; <b>Wider UK</b> is everything else &mdash; the London embassy and beyond &mdash; your expansion view.",
    source: "SAM.gov &middot; U.S. federal contracting (public data)",
    legend: "<b>BASE</b> at a named USAF base &middot; <b>OPEN</b> accepting bids &middot; <b>AWARDED</b> already won &mdash; the winner is a prospect for the review service",
    stats: [
      { f:"all",   id:"total", label:"UK notices indexed" },
      { f:"bases", id:"bases", label:"at the bases", color:"var(--match)" },
      { f:"wider", id:"wider", label:"wider UK", color:"var(--lead)" },
      { f:"award", id:"award", label:"awards (prospects)", color:"var(--build)" },
    ],
    tabs: [
      { f:"bases", label:"Bases" },
      { f:"wider", label:"Wider UK" },
      { f:"award", label:"Awards (prospects)" },
      { f:"all",   label:"All" },
    ],
    default: "bases",
  },
};

let TENDERS = [], PACKS = {}, CURRENT_J = "uk", CURRENT_F = "ipp";

function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function money(min,max,cur){const sym=cur==="USD"?"$":"&pound;";const f=n=>sym+Number(n).toLocaleString("en-GB",{maximumFractionDigits:0});
  if(min!=null&&max!=null&&min!==max)return f(min)+"&ndash;"+f(max);const v=(max!=null?max:min);return v!=null?f(v):"value not stated";}
function dl(d){if(!d)return"";const dt=new Date(d);const days=Math.ceil((dt-Date.now())/86400000);
  const t=dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});return days>=0?"closes "+t+" &middot; "+days+"d":"closed "+t;}
function pub(d){if(!d)return"";return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}
function isOpen(t){return t.stage==="tender" && (!t.deadline_date || new Date(t.deadline_date) >= new Date());}
function isAward(t){return t.stage==="award" || t.stage==="awardUpdate";}
function isClosed(t){
  if(isAward(t)) return true;
  if(t.deadline_date && new Date(t.deadline_date) < new Date()) return true;
  return false;
}
function geoOk(t){
  const g=(t.cls_geography||"").toLowerCase().replace(/[^a-z]/g,"");
  if(!g) return true;
  return g.includes("england")||g.includes("scotland")||g.includes("wales")||g.includes("ukwide")||g.includes("unitedkingdom");
}
// A bid-support lead: a live, SME-suitable UK contract a business could be helped to win.
function isLead(t){return jur(t)==="uk" && isOpen(t) && t.cls_sme_suitable===true && geoOk(t);}
// A named USAF base in the UK: the core of the US index. Everything else UK-performed
// is "wider UK" (embassy etc.) — the expansion view. Detected from place/title text.
const US_BASES = ["lakenheath","mildenhall","alconbury","molesworth","croughton","feltwell","fairford","menwith","rafl","rafm"];
function isUsBase(t){
  const hay = ((t.region||"")+" "+(t.title||"")+" "+(t.buyer_name||"")).toLowerCase();
  return US_BASES.some(k=>hay.includes(k));
}
function jur(t){return t.jurisdiction || "uk";}
function subset(){return TENDERS.filter(t=>jur(t)===CURRENT_J);}

// minimal markdown -> html for stored bid-pack text
function md(src){
  const lines=esc(src||"").split("\n");const out=[];let inList=false;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  for(let raw of lines){const line=raw.trim();
    const close=()=>{if(inList){out.push("</ul>");inList=false;}};
    if(/^### /.test(line)){close();out.push("<h5>"+inl(line.slice(4))+"</h5>");}
    else if(/^## /.test(line)){close();out.push("<h4>"+inl(line.slice(3))+"</h4>");}
    else if(/^[-*] /.test(line)){if(!inList){out.push("<ul>");inList=true;}out.push("<li>"+inl(line.slice(2))+"</li>");}
    else if(line===""){close();}
    else{close();out.push("<p>"+inl(line)+"</p>");}
  }
  if(inList)out.push("</ul>");
  return out.join("");
}

function ukCard(t){
  const buildable = t.build_solo==="yes"||t.build_solo==="partial";
  const open = isOpen(t), closed = isClosed(t), lead = isLead(t);
  const tags=(t.cls_tech_tags||[]).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join("");
  let build="";
  if(t.build_assessed && t.build_solo && t.build_solo!=="no"){
    build=`<div class="build">
      <div class="bh"><span class="dot ${t.build_solo}"></span>Build-to-order: <b>${esc(SOLO[t.build_solo]||t.build_solo)}</b>${t.build_effort?" &middot; "+esc(t.build_effort):""}</div>
      ${t.build_core?`<div class="bl"><em>What</em> ${esc(t.build_core)}</div>`:""}
      ${t.build_stack?`<div class="bl"><em>How</em> ${esc(t.build_stack)}</div>`:""}
      ${t.build_blockers?`<div class="bl warn"><em>Catch</em> ${esc(t.build_blockers)}</div>`:""}
      ${t.build_reusable?`<div class="bl"><em>Sell-many</em> ${esc(t.build_reusable)}</div>`:""}
    </div>`;
  }
  let pack="";
  const p=PACKS[t.notice_id];
  if(p){
    pack=`<button class="bidbtn" onclick="this.nextElementSibling.classList.toggle('open')">View bid pack &mdash; requirements, spec &amp; draft &rarr;</button>
      <div class="pack">${md(p.requirements)}${md(p.build_spec)}${md(p.draft_bid)}
        <div class="disc">Drafted from the published notice + general practice; confirm against the tender documents.</div></div>`;
  }
  const diff=t.build_difficulty?`<span class="pill d-${t.build_difficulty}">${DIFF[t.build_difficulty]||t.build_difficulty}</span>`:"";
  const closedPill = closed?`<span class="pill c">${isAward(t)?"AWARDED":"CLOSED"}</span>`:"";
  const srcName = t.source==="contracts_finder"?"Contracts Finder":"Find a Tender";
  return `<article class="card ${t.matched_filter?'match':''} ${closed?'closed':''}">
    <div class="meta">
      ${open?'<span class="pill o">OPEN</span>':''}
      ${closedPill}
      ${t.matched_filter?'<span class="pill m">FOR IPP</span>':''}
      ${lead?'<span class="pill l">LEAD</span>':''}
      ${buildable?'<span class="pill b">BUILD</span>':''}
      ${diff}
      <span>${esc(t.cls_sector||"-")}</span><span>&middot;</span><span>${esc(t.stage||"-")}</span><span>&middot;</span><span>${esc(srcName)}</span>${t.published_date?'<span>&middot;</span><span>added '+esc(pub(t.published_date))+'</span>':''}
      <span class="geo">${esc(t.cls_geography||"")}</span>
    </div>
    <h3>${t.source_url?`<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.title)}</a>`:esc(t.title)}</h3>
    <div class="line"><strong>${esc(t.buyer_name||"Unknown buyer")}</strong> &middot; ${money(t.value_min,t.value_max,t.currency)}${t.deadline_date?" &middot; "+dl(t.deadline_date):""}</div>
    <div class="line sub">${esc(t.cls_category||"-")} &middot; ${esc(t.cls_complexity||"-")} complexity${t.cls_framework_route&&t.cls_framework_route!=="unknown"?" &middot; "+esc(t.cls_framework_route):""}${tags}</div>
    ${t.cls_reasoning?`<div class="why">${esc(t.cls_reasoning)}</div>`:""}
    ${build}${pack}
  </article>`;
}

function usCard(t){
  const open=isOpen(t), award=isAward(t), base=isUsBase(t);
  const tags=(t.cpv_codes||[]).filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join("");
  return `<article class="card ${base?'match':''} ${award?'closed':''}">
    <div class="meta">
      ${open?'<span class="pill o">OPEN</span>':''}
      ${award?'<span class="pill c">AWARDED</span>':''}
      ${base?'<span class="pill m">BASE</span>':'<span class="pill l">WIDER UK</span>'}
      <span>${esc(t.status||t.stage||"notice")}</span><span>&middot;</span><span>SAM.gov</span>${t.published_date?'<span>&middot;</span><span>added '+esc(pub(t.published_date))+'</span>':''}
      <span class="geo">${esc(t.region||"")}</span>
    </div>
    <h3>${t.source_url?`<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.title||"Untitled notice")}</a>`:esc(t.title||"Untitled notice")}</h3>
    <div class="line"><strong>${esc(t.buyer_name||"US contracting office")}</strong>${(t.value_min!=null||t.value_max!=null)?" &middot; "+money(t.value_min,t.value_max,t.currency||"USD"):""}${t.deadline_date?" &middot; "+dl(t.deadline_date):""}</div>
    ${tags?`<div class="line sub">codes: ${tags}</div>`:""}
  </article>`;
}

function cardHTML(t){return jur(t)==="us"?usCard(t):ukCard(t);}

function passesFilter(t,f){
  if(f==="all") return true;
  if(f==="open") return isOpen(t);
  if(f==="ipp") return !!t.matched_filter;
  if(f==="lead") return isLead(t);
  if(f==="build") return t.build_solo==="yes"||t.build_solo==="partial";
  if(f==="bases") return isUsBase(t);
  if(f==="wider") return !isUsBase(t);
  if(f==="award") return isAward(t);
  return true;
}

function statCount(f,sub){return sub.filter(t=>passesFilter(t,f)).length;}

function refreshStats(){
  const sub=subset();
  VIEW[CURRENT_J].stats.forEach(s=>{const el=document.getElementById("s-"+s.id); if(el) el.textContent=statCount(s.f,sub);});
}

function emptyMsg(f){
  const total=subset().length;
  if(CURRENT_J==="us"){
    if(total===0) return "The US index switches on at the next morning run. The free SAM key's daily quota resets at midnight UTC, so UK-performed US-government notices &mdash; the bases and beyond &mdash; start landing here from the next run.";
    if(f==="bases") return "No base notices live right now. Check <b>Wider UK</b> for other UK-performed US work, or untick 'hide closed' for awarded ones.";
    if(f==="wider") return "No wider-UK notices live right now &mdash; everything indexed is at the bases. The <b>Bases</b> tab has them.";
    if(f==="award") return "No award notices in the current window yet.";
    return "Nothing in this view yet.";
  }
  if(f==="ipp") return "No live contracts for IPP to bid on right now. Untick 'hide closed' to see awarded ones as demand signals, or check the daily run later.";
  if(f==="lead") return "No open bid-support leads right now. These are live, SME-suitable contracts you could approach a business about helping them win &mdash; the daily run adds more each morning.";
  if(f==="open") return "No open tenders in the current batch &mdash; most of what's in right now are awards. Open ones appear here as the daily run pulls them.";
  if(document.getElementById("hideClosed").checked) return "Nothing live in this view right now. Closed &amp; awarded notices are hidden &mdash; untick the box above to see them as demand signals.";
  return "Nothing in this view yet. The daily run will fill it.";
}

function render(f){
  CURRENT_F=f;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.f===f));
  document.querySelectorAll(".stat[data-f]").forEach(s=>s.classList.toggle("on",s.dataset.f===f));
  const hide=document.getElementById("hideClosed").checked && f!=="award" && f!=="all";
  let show=subset().filter(t=>passesFilter(t,f));
  if(hide) show=show.filter(t=>!isClosed(t));
  const list=document.getElementById("list");
  list.innerHTML = show.length ? show.map(cardHTML).join("") : `<div class="state">${emptyMsg(f)}</div>`;
}

function rank(t){
  const o=isOpen(t)?0:1;
  const b=(t.build_solo==="yes"?0:t.build_solo==="partial"?1:5);
  const m=t.matched_filter?0:1;
  const d={hard:0,moderate:1,easy:2}[t.build_difficulty]!=null?{hard:0,moderate:1,easy:2}[t.build_difficulty]:3;
  return [o,b,m,d];
}

function buildControls(j){
  const v=VIEW[j];
  document.getElementById("lede").innerHTML=v.lede;
  document.getElementById("legend").innerHTML=v.legend;
  document.getElementById("src").innerHTML=v.source;
  const statsEl=document.getElementById("stats");
  statsEl.innerHTML=v.stats.map(s=>
    `<div class="stat" data-f="${s.f}"><b id="s-${s.id}"${s.color?` style="color:${s.color}"`:""}>&middot;</b><span>${s.label}</span></div>`
  ).join("");
  document.getElementById("tabs").innerHTML=v.tabs.map(t=>
    `<button data-f="${t.f}"${t.f===v.default?' class="on"':''}>${t.label}</button>`
  ).join("");
  statsEl.querySelectorAll(".stat[data-f]").forEach(s=>s.addEventListener("click",()=>{
    render(s.dataset.f);
    document.querySelector(".controls").scrollIntoView({behavior:"smooth",block:"start"});
  }));
  document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.f)));
}

function setJurisdiction(j){
  CURRENT_J=j;
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.j===j));
  buildControls(j);
  refreshStats();
  render(VIEW[j].default);
}

function renderReadiness(rows){
  rows.sort((a,b)=>(a.sort_order||100)-(b.sort_order||100));
  const done=rows.filter(r=>r.status==="done").length;
  const prog=rows.filter(r=>r.status==="in_progress").length;
  const items=rows.map(r=>{
    const st=RST[r.status]||RST.not_started;
    return `<div class="rrow">
      <span class="rdot ${st.c}" title="${st.l}"></span>
      <span class="rname">${esc(r.route_name)}${r.priority==="high"?'<span class="rprio">priority</span>':""}</span>
      <span class="rnext">${esc(r.next_action||"")}</span>
    </div>`;
  }).join("");
  document.getElementById("rlist").innerHTML =
    `<div class="rsum">${done} on &middot; ${prog} in progress &middot; ${rows.length-done-prog} still to do</div>${items}`;
}

async function load(){
  try{
    const [tr,pr,rr,sr]=await Promise.all([
      fetch(SUPABASE_URL+"/rest/v1/tenders?select=*&order=published_date.desc.nullslast&limit=2000",{headers:HEADERS}),
      fetch(SUPABASE_URL+"/rest/v1/bid_packs?select=*",{headers:HEADERS}),
      fetch(SUPABASE_URL+"/rest/v1/ingest_runs?select=started_at&order=started_at.desc&limit=1",{headers:HEADERS}),
      fetch(SUPABASE_URL+"/rest/v1/supplier_applications?select=*",{headers:HEADERS})
    ]);
    if(!tr.ok) throw new Error("tenders "+tr.status);
    TENDERS=await tr.json();
    const packs=pr.ok?await pr.json():[];
    packs.forEach(p=>{PACKS[p.notice_id]=p;});
    TENDERS.sort((a,b)=>{
      const da=new Date(a.published_date||0), db=new Date(b.published_date||0);
      if(db-da!==0) return db-da;
      const x=rank(a),y=rank(b);
      for(let i=0;i<x.length;i++){if(x[i]!==y[i])return x[i]-y[i];}
      return 0;
    });
    const runs=rr.ok?await rr.json():[];
    if(runs[0]) document.getElementById("updated").textContent="Updated daily · last run "+new Date(runs[0].started_at).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
    if(sr.ok){ const apps=await sr.json(); if(apps.length) renderReadiness(apps); }
    setJurisdiction("uk");
  }catch(e){
    document.getElementById("list").innerHTML=`<div class="state err">Couldn't load live data (${esc(e.message)}). If you opened this file directly, try the hosted version instead &mdash; some browsers block data requests from local files.</div>`;
  }
}
document.querySelectorAll("#seg button").forEach(b=>b.addEventListener("click",()=>setJurisdiction(b.dataset.j)));
document.getElementById("hideClosed").addEventListener("change",()=>render(CURRENT_F));
load();
</script>
